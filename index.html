<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>书房</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Ma+Shan+Zheng&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>
    <div id="warm-grade"></div>

    <div id="loading">
      <div class="loading-text">loading…</div>
    </div>

    <div id="hint" class="hidden">try to click</div>

    <div id="welcome-text" class="lang-en"></div>

    <div id="note-layer"></div>

    <div id="tooltip" class="hidden"></div>

    <button id="room-lang-toggle">中文</button>

    <div id="map-modal" class="hidden">
      <div id="map-panel">
        <button id="map-close" aria-label="Close">×</button>
        <h2>Places I've been</h2>
        <p class="map-hint">Click empty space to add a pin · click an existing pin to remove it</p>
        <div id="leaflet-map"></div>
      </div>
    </div>

    <div id="music-modal" class="hidden">
      <div id="musicPanel">
        <button id="closeMusic" aria-label="Close">×</button>
        <ul id="playlist"></ul>
        <audio id="audioPlayer" controls></audio>
      </div>
    </div>

    <div id="board-modal" class="hidden">
      <div id="board-panel">
        <button id="board-close" aria-label="Close">×</button>
        <h2>Guestbook</h2>
        <p class="board-hint">Click empty cork to pin a note · click a note to view or reply · you can only delete your own</p>
        <div id="board-canvas"></div>

        <div id="note-detail" class="hidden">
          <button id="note-detail-close" aria-label="Back to corkboard">← Back</button>
          <div id="note-detail-author"></div>
          <div id="note-detail-content"></div>
          <div id="note-detail-time"></div>
          <button id="note-detail-delete" class="hidden">Delete this note</button>
          <div id="note-replies"></div>
          <form id="reply-form">
            <input id="reply-name-input" type="text" placeholder="Your name" maxlength="30" autocomplete="off" />
            <input id="reply-input" type="text" placeholder="Write a reply…" maxlength="200" autocomplete="off" />
            <button type="submit">Send</button>
          </form>
        </div>
      </div>
    </div>

    <div id="laptop-overlay" class="hidden">
      <button id="laptop-exit">← Exit</button>
      <iframe id="laptop-iframe" src="academic.html" title="Personal homepage"></iframe>
    </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2",
        "leaflet": "https://esm.sh/leaflet@1.9.4"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
